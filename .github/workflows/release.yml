name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Setup Pesde
        uses: pesde-pkg/setup@main

      - name: Check formatting (StyLua)
        run: stylua --check src/

      - name: Lint (Selene)
        run: selene src/

      - name: Install dependencies
        run: pesde install

      - name: Run tests
        run: lune run .lune/run_tests.luau

      - name: Strip test files from build
        run: find src -name "*.spec.lua" -delete

      - name: Build .rbxm
        run: rojo build default.project.json -o Riptide.rbxm

      - name: Extract clean version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Riptide ${{ github.ref_name }}
          body: |
            ## 🌊 Riptide ${{ github.ref_name }}

            ### Installation

            **Via Pesde (recommended):**
            ```toml
            [dependencies]
            Riptide = { name = "riptide/core", version = "${{ steps.version.outputs.VERSION }}" }
            ```

            **Manual:** Download `Riptide.rbxm` below and insert into `ReplicatedStorage`.
          files: Riptide.rbxm
          generate_release_notes: true
