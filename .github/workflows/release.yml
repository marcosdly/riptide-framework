name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Setup Pesde
        uses: pesde-pkg/setup@main

      - name: Check formatting (StyLua)
        run: stylua --check src/ test/ .lune/

      - name: Lint (Selene)
        run: selene src/ test/ .lune/

      - name: Version preflight (warning only)
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PESDE_VERSION="$(grep -E '^version\s*=\s*"' pesde.toml | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')"

          if [[ -z "${PESDE_VERSION}" ]]; then
            echo "::warning::Could not read version from pesde.toml"
          elif [[ "${PESDE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::warning::Version mismatch: tag=${TAG_VERSION}, pesde.toml=${PESDE_VERSION}"
          fi

          if ! grep -Eq "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md does not contain section [${TAG_VERSION}]"
          fi

      - name: Install dependencies
        run: pesde install

      - name: Run tests
        run: lune run test/lune/RunLuneTests.luau

      - name: Build .rbxm
        run: rojo build default.project.json -o Riptide.rbxm

      - name: Extract clean version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Riptide ${{ github.ref_name }}
          body: |
            ## 🌊 Riptide ${{ github.ref_name }}

            ### Installation

            **Via Pesde (recommended):**
            ```toml
            [dependencies]
            Riptide = { name = "riptide/core", version = "${{ steps.version.outputs.VERSION }}" }
            ```

            **Manual:** Download `Riptide.rbxm` below and insert into `ReplicatedStorage`.
          files: Riptide.rbxm
          generate_release_notes: true
