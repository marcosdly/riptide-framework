name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Check formatting (StyLua)
        run: stylua --check src/ test/ .lune/

      - name: Lint (Selene)
        run: selene src/ test/ .lune/

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Setup Pesde
        uses: pesde-pkg/setup@main

      - name: Install dependencies
        run: pesde install

      - name: Run tests
        run: lune run .lune/run_tests.luau
